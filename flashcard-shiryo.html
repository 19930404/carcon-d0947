<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>資料問題カード - キャリアコンサルタント試験</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
    background: linear-gradient(160deg,#553c9a 0%,#44337a 50%,#322659 100%);
    min-height:100vh; color:#1a202c; padding:12px; padding-bottom:60px; }
  .container { max-width:600px; margin:0 auto; }

  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px; }
  header h1 { color:#fff; font-size:1rem; font-weight:bold; flex:1; text-align:center; }
  .home-btn { display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:10px; background:rgba(255,255,255,.2); color:#fff; text-decoration:none; font-size:1.2rem; flex-shrink:0; }
  .home-btn:hover { background:rgba(255,255,255,.35); }
  .spacer { width:40px; flex-shrink:0; }

  .progress-info { display:flex; justify-content:space-between; align-items:center; color:#e9d8fd; font-size:.78rem; font-weight:bold; margin-bottom:8px; padding:0 4px; }
  .progress-bar-outer { height:6px; background:rgba(255,255,255,.2); border-radius:3px; overflow:hidden; margin-bottom:12px; }
  .progress-bar-inner { height:100%; background:linear-gradient(90deg, #9f7aea, #805ad5); transition:width .3s; }

  .mode-tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .mode-tab { flex:1; min-width:60px; padding:8px 10px; border:none; border-radius:8px; background:rgba(255,255,255,.15); color:#fff; font-weight:bold; font-size:.75rem; cursor:pointer; font-family:inherit; transition:.15s; }
  .mode-tab.active { background:#fff; color:#553c9a; }

  .card-area { perspective:1200px; margin-bottom:16px; }
  .card { width:100%; min-height:360px; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .card.flipped { transform:rotateY(180deg); }
  .card-face { position:absolute; inset:0; backface-visibility:hidden; background:#fff; border-radius:20px; padding:24px 20px; box-shadow:0 12px 32px rgba(0,0,0,.3); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; min-height:360px; }
  .card-back { transform:rotateY(180deg); background:linear-gradient(135deg, #faf5ff, #e9d8fd); align-items:flex-start; justify-content:flex-start; text-align:left; overflow-y:auto; padding:18px; }
  .card-category { position:absolute; top:12px; left:16px; font-size:.68rem; color:#a0aec0; font-weight:bold; letter-spacing:.05em; }
  .card-index { position:absolute; top:12px; right:16px; font-size:.68rem; color:#a0aec0; font-weight:bold; }

  .card-front-name { font-size:1.35rem; font-weight:bold; color:#553c9a; margin-bottom:10px; line-height:1.3; }
  .card-front-sub { font-size:.82rem; color:#718096; line-height:1.5; max-width:100%; padding:0 8px; }
  .card-front-hint { font-size:.72rem; color:#a0aec0; margin-top:20px; }

  .card-back-title { font-size:.72rem; color:#553c9a; font-weight:bold; margin-bottom:4px; }
  .card-back-main { font-size:.95rem; font-weight:bold; color:#2d3748; margin-bottom:10px; line-height:1.5; }
  .card-back-section { width:100%; padding:10px 12px; margin-bottom:8px; border-radius:8px; font-size:.8rem; line-height:1.65; white-space:pre-wrap; }
  .card-back-section .section-label { font-weight:bold; font-size:.68rem; display:block; margin-bottom:4px; letter-spacing:.05em; }
  .sec-num { background:#e6fffa; border-left:3px solid #38b2ac; color:#234e52; }
  .sec-num .section-label { color:#2c7a7b; }
  .sec-taio { background:#fff5f5; border-left:3px solid #e53e3e; color:#742a2a; }
  .sec-taio .section-label { color:#c53030; }
  .sec-goro { background:#fefcbf; border-left:3px solid #d69e2e; color:#744210; font-weight:bold; font-size:.88rem; }
  .sec-goro .section-label { color:#b7791f; }

  .judge-btns { display:flex; gap:10px; margin-bottom:12px; }
  .judge-btn { flex:1; padding:16px 20px; border:none; border-radius:12px; color:#fff; font-weight:bold; font-size:.95rem; cursor:pointer; font-family:inherit; min-height:60px; }
  .judge-btn:active { transform:scale(.96); }
  .judge-btn.no { background:linear-gradient(135deg, #e53e3e, #c53030); }
  .judge-btn.yes { background:linear-gradient(135deg, #48bb78, #38a169); }
  .judge-btn:disabled { opacity:.4; cursor:not-allowed; }

  .nav-btns { display:flex; gap:8px; }
  .nav-btn { flex:1; padding:10px 16px; border:none; border-radius:8px; background:rgba(255,255,255,.15); color:#fff; font-weight:bold; font-size:.82rem; cursor:pointer; font-family:inherit; }
  .nav-btn:disabled { opacity:.3; cursor:not-allowed; }

  .complete { background:#fff; border-radius:20px; padding:32px 24px; text-align:center; box-shadow:0 12px 32px rgba(0,0,0,.3); }
  .complete-emoji { font-size:4rem; margin-bottom:12px; }
  .complete h2 { color:#553c9a; margin-bottom:8px; }
  .complete .score { font-size:2rem; font-weight:bold; color:#805ad5; margin:12px 0; }
  .complete p { color:#4a5568; font-size:.88rem; margin-bottom:20px; }
  .complete button { padding:12px 24px; border:none; border-radius:10px; background:#805ad5; color:#fff; font-weight:bold; cursor:pointer; margin:4px; font-family:inherit; }
  .complete button.secondary { background:#718096; }

  .empty { background:#fff; border-radius:20px; padding:40px 20px; text-align:center; }
  .empty p { color:#718096; margin-bottom:16px; }
  .empty button { padding:12px 24px; border:none; border-radius:10px; background:#805ad5; color:#fff; font-weight:bold; cursor:pointer; font-family:inherit; }

  .stats-mini { display:flex; gap:8px; margin-bottom:12px; font-size:.72rem; color:#fff; }
  .stats-mini > div { flex:1; background:rgba(255,255,255,.1); border-radius:8px; padding:6px 8px; text-align:center; }
  .stats-mini .num { display:block; font-weight:bold; font-size:1rem; color:#e9d8fd; }

  @media (max-width: 400px) {
    .card-front-name { font-size:1.2rem; }
    .card-back-main { font-size:.88rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <a href="index.html" class="home-btn" title="メニューに戻る">🏠</a>
    <h1>📑 資料問題カード</h1>
    <div class="spacer"></div>
  </header>

  <div id="app">
    <div class="empty"><p>読み込み中...</p></div>
  </div>
</div>

<script src="datashiryo.js?v=10"></script>
<script>
/* =========================================================
   資料問題カード - 自動生成
   ========================================================= */
const CARD_STORE_KEY = 'cc_flashcardShiryoProgress';
const SESSION_SIZE = 10;

let allCards = [];
let session = [];
let currentIdx = 0;
let currentFlipped = false;
let sessionCorrect = 0;
let sessionWrong = 0;
let currentFilter = 'all';

/* =========================================================
   データ抽出
   ========================================================= */
function extractSection(basics, label) {
  if (!basics) return '';
  const re = new RegExp('【' + label + '】([\\s\\S]+?)(?=【|$)');
  const m = basics.match(re);
  return m ? m[1].trim() : '';
}

function shortenQuestion(t) {
  let s = t || '';
  s = s.replace(/^\d{4}年版（[^）]+）/, '');
  s = s.replace(/^「[^」]+」/, '');
  const aboutIdx = s.indexOf('について');
  if (aboutIdx > 10 && aboutIdx < 80) {
    s = s.substring(0, aboutIdx);
  } else {
    s = s.replace(/として最も適切なものはどれか。?$/, '');
    s = s.replace(/はどれか。?$/, '');
  }
  return s.trim().substring(0, 60);
}

function buildCards() {
  if (!window.qDataShiryo) return [];
  const cards = [];

  window.qDataShiryo.forEach((q, idx) => {
    const f = q.f || '';
    const shiryoName = f.replace('資料問題｜', '');
    const level = q.level || 'B';
    const basics = q.basics || '';

    const nums = extractSection(basics, '数字');
    const taio = extractSection(basics, '対比');
    const goro = extractSection(basics, '語呂');
    const riyu = extractSection(basics, '理由');

    if (!nums && !goro && !taio) return;

    cards.push({
      id: 'sh_' + idx,
      level: level,
      shiryoName: shiryoName,
      question: shortenQuestion(q.t),
      nums: nums,
      taio: taio,
      goro: goro,
      riyu: riyu,
      basics: basics,
    });
  });

  return cards;
}

/* =========================================================
   間隔反復
   ========================================================= */
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(CARD_STORE_KEY) || '{}'); } catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(CARD_STORE_KEY, JSON.stringify(p)); }

function getCardProgress(cardId) {
  const p = loadProgress();
  return p[cardId] || { level: 0, lastShown: null, nextShow: null, correct: 0, wrong: 0 };
}

function updateCardProgress(cardId, isCorrect) {
  const p = loadProgress();
  const cur = p[cardId] || { level: 0, lastShown: null, nextShow: null, correct: 0, wrong: 0 };
  if (isCorrect) {
    cur.level = Math.min(5, cur.level + 1);
    cur.correct++;
  } else {
    cur.level = 0;
    cur.wrong++;
  }
  cur.lastShown = new Date().toISOString();
  cur.nextShow = calcNextShow(cur.level);
  p[cardId] = cur;
  saveProgress(p);
}

function calcNextShow(level) {
  const days = [0, 1, 3, 7, 14, 30][level];
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString();
}

/* =========================================================
   セッション構築
   ========================================================= */
function filterCards(cards, level) {
  if (level === 'all') return cards;
  return cards.filter(c => c.level === level);
}

function buildSession(cards) {
  let pool = cards.slice();
  pool = pool.map(c => ({ c, p: getCardProgress(c.id) }))
    .sort((a, b) => {
      const la = a.p.level;
      const lb = b.p.level;
      if (la !== lb) return la - lb;
      return b.p.wrong - a.p.wrong;
    })
    .map(x => x.c);
  return pool.slice(0, SESSION_SIZE);
}

/* =========================================================
   レンダリング
   ========================================================= */
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const app = document.getElementById('app');
  const progress = loadProgress();
  const filteredCards = filterCards(allCards, currentFilter);
  const total = filteredCards.length;
  const mastered = filteredCards.filter(c => (progress[c.id]?.level || 0) >= 5).length;

  if (session.length > 0 && currentIdx >= session.length) {
    renderComplete();
    return;
  }

  if (session.length === 0) {
    app.innerHTML = `
      <div class="mode-tabs">
        <button class="mode-tab ${currentFilter==='all'?'active':''}" data-filter="all">全部</button>
        <button class="mode-tab ${currentFilter==='S'?'active':''}" data-filter="S">Sランク</button>
        <button class="mode-tab ${currentFilter==='A'?'active':''}" data-filter="A">Aランク</button>
        <button class="mode-tab ${currentFilter==='B'?'active':''}" data-filter="B">Bランク</button>
      </div>
      <div class="stats-mini">
        <div><span class="num">${total}</span>カード</div>
        <div><span class="num">${mastered}</span>卒業</div>
      </div>
      <div class="empty">
        <p>「${currentFilter === 'all' ? '全ランク' : currentFilter + 'ランク'}」の資料問題カードを始めます</p>
        <button onclick="startSession()">▶ 開始（最大${SESSION_SIZE}枚）</button>
      </div>
    `;
    document.querySelectorAll('.mode-tab').forEach(b => {
      b.addEventListener('click', () => { currentFilter = b.dataset.filter; render(); });
    });
    return;
  }

  const card = session[currentIdx];

  const numSection = card.nums ? `<div class="card-back-section sec-num"><span class="section-label">📊 数字</span>${escapeHtml(card.nums)}</div>` : '';
  const taioSection = card.taio ? `<div class="card-back-section sec-taio"><span class="section-label">⚖️ 対比</span>${escapeHtml(card.taio)}</div>` : '';
  const goroSection = card.goro ? `<div class="card-back-section sec-goro"><span class="section-label">📝 語呂</span>${escapeHtml(card.goro)}</div>` : '';

  app.innerHTML = `
    <div class="progress-info">
      <span>${currentIdx + 1} / ${session.length}</span>
      <span>✅ ${sessionCorrect} ／ ❌ ${sessionWrong}</span>
    </div>
    <div class="progress-bar-outer">
      <div class="progress-bar-inner" style="width:${(currentIdx / session.length) * 100}%"></div>
    </div>

    <div class="card-area">
      <div class="card ${currentFlipped?'flipped':''}" id="cardEl" onclick="toggleFlip()">
        <div class="card-face card-front">
          <span class="card-category">📑 ${escapeHtml(card.level)}ランク</span>
          <span class="card-index">${currentIdx + 1}</span>
          <div class="card-front-name">${escapeHtml(card.shiryoName)}</div>
          <div class="card-front-sub">${escapeHtml(card.question)}</div>
          <div class="card-front-hint">👆 タップで答えを見る</div>
        </div>
        <div class="card-face card-back">
          <span class="card-category">💡 答え</span>
          <span class="card-index">${currentIdx + 1}</span>
          ${numSection}
          ${taioSection}
          ${goroSection}
        </div>
      </div>
    </div>

    <div class="judge-btns">
      <button class="judge-btn no" onclick="judge(false)" ${!currentFlipped?'disabled':''}>😰 覚えてない</button>
      <button class="judge-btn yes" onclick="judge(true)" ${!currentFlipped?'disabled':''}>😊 覚えた</button>
    </div>

    <div class="nav-btns">
      <button class="nav-btn" onclick="prevCard()" ${currentIdx===0?'disabled':''}>← 前へ</button>
      <button class="nav-btn" onclick="skipCard()">スキップ</button>
    </div>
  `;

  const cardEl = document.getElementById('cardEl');
  if (currentFlipped) cardEl.classList.add('flipped');
}

function renderComplete() {
  const app = document.getElementById('app');
  const total = session.length;
  const rate = total > 0 ? Math.round(sessionCorrect / total * 100) : 0;
  let emoji = '📚', msg = '復習しましょう';
  if (rate >= 90) { emoji = '🏆'; msg = '完璧！資料マスター！'; }
  else if (rate >= 70) { emoji = '✅'; msg = 'いい調子！'; }
  else if (rate >= 50) { emoji = '💪'; msg = 'もう少し！'; }

  app.innerHTML = `
    <div class="complete">
      <div class="complete-emoji">${emoji}</div>
      <h2>${msg}</h2>
      <div class="score">${sessionCorrect} / ${total}</div>
      <p>正答率 ${rate}%</p>
      <button onclick="restartSession()">🔄 もう一度</button>
      <button class="secondary" onclick="backToTop()">🏠 トップへ</button>
    </div>
  `;
}

/* =========================================================
   操作
   ========================================================= */
function toggleFlip() {
  currentFlipped = !currentFlipped;
  const cardEl = document.getElementById('cardEl');
  if (cardEl) cardEl.classList.toggle('flipped', currentFlipped);
  document.querySelectorAll('.judge-btn').forEach(b => b.disabled = !currentFlipped);
}

function judge(isCorrect) {
  if (!currentFlipped) return;
  const card = session[currentIdx];
  updateCardProgress(card.id, isCorrect);
  if (isCorrect) sessionCorrect++;
  else sessionWrong++;
  currentIdx++;
  currentFlipped = false;
  render();
}

function skipCard() {
  currentIdx++;
  currentFlipped = false;
  render();
}

function prevCard() {
  if (currentIdx > 0) {
    currentIdx--;
    currentFlipped = false;
    render();
  }
}

function startSession() {
  const filtered = filterCards(allCards, currentFilter);
  session = buildSession(filtered);
  currentIdx = 0;
  currentFlipped = false;
  sessionCorrect = 0;
  sessionWrong = 0;
  if (session.length === 0) {
    alert('該当するカードがありません');
    session = [];
    render();
    return;
  }
  render();
}

function restartSession() { startSession(); }
function backToTop() { session = []; currentIdx = 0; render(); }

/* =========================================================
   初期化
   ========================================================= */
function init() {
  allCards = buildCards();
  console.log('[shiryo-flashcard] 生成されたカード:', allCards.length);
  render();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
